<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=2560, initial-scale=1">
  <title>ミラドキランド24時間生放送 タイムテーブル（暫定版）</title>
  <link rel="stylesheet" href="timetable-poster.css">
</head>
<body>
  <main class="poster" aria-label="ミラドキランド24時間生放送 タイムテーブル">
    <header class="poster-header">
      <div class="poster-brand">
        <img src="assets/images/logo.png" alt="ミラドキランド">
        <p>MIRADOKI LAND · 24H LIVE STREAM</p>
      </div>

      <div class="poster-title">
        <p>24 HOURS SPECIAL PROGRAM</p>
        <h1>24時間生放送<br><span>タイムテーブル</span></h1>
      </div>

      <div class="poster-date">
        <span>LIVE DATE</span>
        <strong>2026.08.29 <small>SAT</small></strong>
        <b>20:00</b>
        <i>→</i>
        <strong>08.30 <small>SUN</small></strong>
        <b>19:59</b>
      </div>
    </header>

    <div class="poster-rule" aria-hidden="true"><span></span><b>TEST PREVIEW · 暫定版</b><span></span></div>

    <section class="poster-board" id="poster-board" aria-label="番組一覧">
      <p class="poster-loading">タイムテーブルを読み込んでいます…</p>
    </section>

    <footer class="poster-footer">
      <p>※ タイムテーブル・出演者・番組内容は変更になる場合があります。</p>
      <p><strong>#ミラドキランド</strong>　miradoki.com</p>
    </footer>
  </main>

  <script src="timetable-poster.js"></script>
</body>
</html>
